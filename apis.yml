aid: womaness
name: Womaness
description: >-
  Womaness is a women-founded midlife wellness brand created to modernize aging for women and to help
  them navigate the phases their bodies move through around menopause. The direct-to-consumer company
  sells clean, estrogen-free, doctor-approved and clinically tested skincare, supplements, sexual-health
  and menopause-support products (including Let's Neck serum, Melt for You inserts and Daily V Soothe)
  through a Shopify-hosted online store and select retail partners. Surfaced as a portfolio company of
  Obvious Ventures and added to the API Evangelist network; it is a consumer e-commerce brand with no
  first-party public developer API surface.
